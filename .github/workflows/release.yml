# Publish Linux x86-64 packages (AppImage, .deb, .rpm) for each v<version> tag.
# Tests and the package build run in parallel on separate runners (each compiles the whole
# workspace and would fill one runner's disk); the release is published only if both pass.
name: Release Linux packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 Debian/Ubuntu prerequisites (v2.tauri.app/start/prerequisites).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # rustup is preinstalled; rust-toolchain.toml selects the pinned toolchain.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Keeps compiled dependencies between runs; only the workspace crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Test
        run: |
          cargo test --workspace --locked
          npm test --prefix apps/desktop

  appimage:
    # The oldest supported Ubuntu: binaries link against the runner's glibc and run only on systems at least as new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ubuntu-22.04

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      # linuxdeploy runs as an AppImage; extract it instead of relying on FUSE on the runner.
      # .deb and .rpm use the system WebKitGTK, so they are a fraction of the AppImage size.
      - name: Build packages
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles appimage,deb,rpm

      # Bundled libwayland breaks the host Mesa EGL on newer systems ("Could not create default
      # EGL display: EGL_BAD_PARAMETER", blank window). Use the host's copy, which every Wayland/XWayland
      # desktop ships, and repack with the linuxdeploy plugin the Tauri build already downloaded.
      # Fixed asset names across versions. releases/latest/download/... skips pre-releases, so the
      # updater reads its manifest from the fixed `updater` release instead (see Publish).
      - name: Repack without bundled Wayland libraries
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LDAI_OUTPUT: dist/odx-linux-x86_64.AppImage
        run: |
          appdir=target/release/bundle/appimage/Odx.AppDir
          rm -f "$appdir"/usr/lib/libwayland-*.so*
          mkdir dist
          ~/.cache/tauri/linuxdeploy-plugin-appimage.AppImage --appdir "$appdir"

      - name: Collect packages
        run: |
          cp target/release/bundle/deb/*.deb dist/odx-linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm dist/odx-linux-x86_64.rpm
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)

      # Sign the repacked AppImage (the bundler's own signature would cover the pre-repack file).
      # Only the AppImage self-updates; .deb/.rpm users get a link to the release page.
      - name: Sign AppImage and write the updater manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # An unset password env makes the signer prompt on /dev/tty; an empty one signs a passwordless key.
        # stdin is closed and the step times out so a prompt can never hang the job.
        timeout-minutes: 5
        run: |
          : "${TAURI_SIGNING_PRIVATE_KEY:?the TAURI_SIGNING_PRIVATE_KEY secret is not set}"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD-}"
          apps/desktop/node_modules/.bin/tauri signer sign dist/odx-linux-x86_64.AppImage </dev/null
          mkdir updater
          jq -n --arg version "${GITHUB_REF_NAME#v}" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg signature "$(cat dist/odx-linux-x86_64.AppImage.sig)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/odx-linux-x86_64.AppImage" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
            > updater/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: updater
          path: updater/latest.json
          if-no-files-found: error

  publish:
    needs: [test, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: updater
          path: updater

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A SemVer pre-release tag (v0.1.0-alpha.1) is published as a GitHub pre-release.
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Odx $GITHUB_REF_NAME" --generate-notes $prerelease
          # Point installed AppImages at this version only after its assets are published. The fixed
          # `updater` release is a pre-release so it never becomes the repository's "latest".
          gh release view updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create updater --repo "$GITHUB_REPOSITORY" --prerelease --title "Updater manifest" \
              --notes "latest.json for the in-app updater. Do not delete."
          gh release upload updater updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber
