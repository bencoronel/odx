# Checks for pull requests and master. Branch protection needs only the `verify` job.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tauri-linux-deps

      # rustup is preinstalled; rust-toolchain.toml selects the pinned toolchain.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Shares compiled dependencies with release.yml's test job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop
      # tsc -b and vite build: the production bundle must build, not only type-check.
      - run: npm run build --prefix apps/desktop
      - run: npm test --prefix apps/desktop

  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/
      - run: node scripts/ratchet.mjs

  verify:
    if: always()
    needs: [rust, frontend, ratchet]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          [ "${{ needs.rust.result }}" = success ] && [ "${{ needs.frontend.result }}" = success ] \
            && [ "${{ needs.ratchet.result }}" = success ]
