# Known vulnerabilities in Rust and npm dependencies: when a lockfile changes, and weekly for new advisories.
name: Dependency audit

on:
  pull_request:
    paths: [Cargo.lock, deny.toml, apps/desktop/package-lock.json, .github/workflows/dependencies.yml]
  push:
    branches: [master]
    paths: [Cargo.lock, deny.toml, apps/desktop/package-lock.json]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exceptions live in deny.toml, each with its reason and review date.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm audit --audit-level high --prefix apps/desktop
