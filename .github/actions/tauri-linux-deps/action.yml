# Tauri v2 Debian/Ubuntu prerequisites (v2.tauri.app/start/prerequisites), shared by CI and release.
name: Tauri Linux build dependencies
description: Install the system packages Tauri needs to build on Ubuntu.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
