# cargo deny check advisories licenses (CI: .github/workflows/dependencies.yml).
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Only crates we depend on directly; unmaintained crates under tauri/gtk are not ours to replace.
unmaintained = "workspace"
# Each exception says why it cannot reach Odx and when to look again.
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys via bundled-sqlcipher: requires opening an attacker-crafted db + -wal pair; Odx only opens its own local encrypted vault in the user config dir, and sqlcipher-src has no SQLite 3.54.0 release yet. Review by 2027-02-28." },
  { id = "RUSTSEC-2026-0543", reason = "chrono: marked unmaintained with no drop-in replacement; track migration to jiff/time separately. Review by 2027-02-28." },
]

[licenses]
# Odx is AGPL-3.0-or-later: everything it links must be compatible. Add a license here only after checking that.
allow = [
  "0BSD", "AGPL-3.0-or-later", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]
confidence-threshold = 0.9
