# cargo deny check advisories (CI: .github/workflows/dependencies.yml).
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Only crates we depend on directly; unmaintained crates under tauri/gtk are not ours to replace.
unmaintained = "workspace"
# Each exception says why it cannot reach Odx and when to look again.
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip: build-dependency of libsodium-sys-stable 1.24.3 (latest), only unzips its own minisign-verified MSVC binaries on Windows builds; Linux builds never call it. Review by 2027-01-31." },
  { id = "RUSTSEC-2026-0368", reason = "zip: as RUSTSEC-2026-0367. Review by 2027-01-31." },
  { id = "RUSTSEC-2026-0369", reason = "zip: as RUSTSEC-2026-0367. Review by 2027-01-31." },
]
