[workspace]
members = ["crates/odx-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "=0.8.8", features = ["json"] }
bytes = "=1.12.1"
chrono = { version = "=0.4.42", features = ["serde", "clock"] }
digest_auth = "=0.3.1"
hex = "=0.4.3"
libsodium-rs = "=0.3.0"
libc = "=0.2.190"
reqwest = { version = "=0.13.1", default-features = false, features = ["json", "rustls", "socks"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
quick-xml = { version = "=0.42.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
thiserror = "=2.0.17"
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs"] }
url = { version = "=2.5.7", features = ["serde"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[workspace.lints.clippy]
# OdxError carries context for the window and audit; it is returned on cold paths, so its size costs nothing measurable.
result_large_err = "allow"

# Dependencies without debug info: target/debug stays a fraction of its size and test binaries link faster.
# Our own crates keep full debug info.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "fat"
opt-level = "s"
codegen-units = 1
